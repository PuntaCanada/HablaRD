name: Chromium smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: SITE_URL=https://example.com node build.mjs
      - run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { createServer } from 'node:http';
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const server=createServer((req,res)=>{try{const path=new URL(req.url,'http://localhost').pathname;res.setHeader('Content-Type',path.endsWith('.xml')?'application/xml':'text/html; charset=utf-8');res.end(readFileSync('public'+path+(path.endsWith('/')?'index.html':'')))}catch{res.statusCode=404;res.end()}});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const origin='http://127.0.0.1:'+server.address().port;
          const browser=await chromium.launch();
          try {
          for(const width of [375,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900},locale:'de-DE'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(origin+'/');
            assert.equal(await page.locator('html').getAttribute('lang'),'de');
            for(const lang of ['es','en','fr','pt','de']){
              await page.locator('#language').selectOption(lang);
              assert.equal(await page.locator('html').getAttribute('lang'),lang);
              await page.goto(origin+'/'+lang+'/');
              assert.equal(await page.locator('html').getAttribute('lang'),lang);
              assert.equal(await page.locator('link[hreflang]').count(),6);
              assert.equal(await page.locator('link[rel=canonical]').getAttribute('href'),'https://example.com/'+lang+'/');
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
              await page.goto(origin+'/');
            }
            await page.locator('#language').selectOption('en');
            const wordCount=await page.locator('#quiz article').count(); assert.ok(wordCount>=30); await page.locator('#quiz article').first().getByRole('button',{name:'Bus',exact:true}).click(); assert.equal(await page.locator('#score').innerText(),'1 / '+wordCount); await page.reload(); assert.equal(await page.locator('#score').innerText(),'1 / '+wordCount);
            assert.equal(await page.locator('#dialog button').count(),3); assert.equal(await page.locator('#dialog .wordcards p').count(),3); assert.ok((await page.locator('#dialog').innerText()).includes('Voy a Higüey.')); assert.equal(await page.locator('#more-items p').count(),3); assert.ok((await page.locator('#more-items').innerText()).includes('off-road vehicle'));
            assert.equal(await page.locator('#a2-dialog p').count(),3); assert.ok((await page.locator('#a2-note').innerText()).includes('completed events')); assert.equal(await page.locator('#overview-links a').count(),5);
            assert.equal(await page.locator('#practice-progress').innerText(),'0 / 5');
            const exercise=page.locator('#practice-items .exercise').first();
            await exercise.getByRole('button',{name:'están',exact:true}).click();
            assert.ok((await exercise.innerText()).includes('Try again'));
            assert.equal(await page.locator('#practice-progress').innerText(),'0 / 5');
            await exercise.getByRole('button',{name:'está',exact:true}).click();
            assert.equal(await page.locator('#practice-progress').innerText(),'1 / 5');
            await page.reload();
            assert.equal(await page.locator('#practice-progress').innerText(),'1 / 5');
            for(const [lang,label] of [['de','Übungen'],['es','Ejercicios'],['en','Exercises'],['fr','Exercices'],['pt','Exercícios']]){
              await page.locator('#language').selectOption(lang);
              assert.equal(await page.locator('#practice-title').innerText(),label);
              assert.equal(await page.locator('#practice-progress').innerText(),'1 / 5');
            }
            await page.locator('#practice-reset').click();
            await page.reload();
            assert.equal(await page.locator('#practice-progress').innerText(),'0 / 5');
            await page.locator('#language').selectOption('en');
            assert.equal(await page.locator('#dict-results article').count(),55);
            await page.locator('#dict-search').fill('to frio');
            assert.equal(await page.locator('#dict-results article').count(),1);
            await page.locator('#dict-search').fill('bacaneria');
            assert.equal(await page.locator('#dict-results article h3').innerText(),'Bacanería');
            await page.locator('#dict-search').fill('');
            await page.locator('#dict-category').selectOption('chat');
            assert.equal(await page.locator('#dict-results article[data-category]:not([data-category="chat"])').count(),0);
            for(const [lang,label] of [['de','Dominikanisches Wörterbuch'],['es','Diccionario dominicano'],['en','Dominican dictionary'],['fr','Dictionnaire dominicain'],['pt','Dicionário dominicano']]){
              await page.locator('#language').selectOption(lang);
              assert.equal(await page.locator('#dict-title').innerText(),label);
            }
            assert.deepEqual(errors,[]);
            await page.close();
          }
          const xml=readFileSync('public/sitemap.xml','utf8');
          for(const l of ['de','es','en','fr','pt'])assert.ok(xml.includes('https://example.com/'+l+'/'));
          assert.ok(readFileSync('public/robots.txt','utf8').includes('https://example.com/sitemap.xml'));
          } finally {await browser.close();server.close()}
          console.log('Chromium build and feature checks passed');
          JS
