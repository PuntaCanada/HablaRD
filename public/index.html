.append(h);const b=document.createElement('button');b.textContent='🔊';b.setAttribute('aria-label','Audio: '+w[0]);b.onclick=()=>{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(w[0]);u.lang='es-DO';speechSynthesis.speak(u)}};a.append(b);[j,(j+1)%3,(j+2)%3].sort((a,b)=>a-b).forEach(k=>{const x=document.createElement('button');x.textContent=words[k][1][i];x.onclick=()=>{x.textContent=(k===j?'✓ ':'✗ ')+words[k][1][i];if(k===j){try{localStorage.setItem('learned-'+w[0],'1')}catch{}progress()}};a.append(x)});const link=document.createElement('a');link.href=w[2];link.textContent='ASALE';a.append(link);root.append(a)})}function progress(){let count=0;try{count=words.filter(w=>localStorage.getItem('learned-'+w[0])==='1').length}catch{}document.querySelector('#score').textContent=count+' / '+words.length}progress();</script><article><a href="https://www.asale.org/damer/">ASALE</a><p>2026-11-25</p></article></main><footer>HablaRD · República Dominicana</footer><script>const langs=["de","es","en","fr","pt"],titles=["Dominikanisch lernen","Aprende español dominicano","Learn Dominican Spanish","Apprendre l’espagnol dominicain","Aprender espanhol dominicano"],intro=["Wähle die passende Bedeutung. Die Sprachausgabe hängt von deinem Gerät ab.","Elige el significado correcto. La voz depende de tu dispositivo.","Choose the correct meaning. Audio depends on your device.","Choisissez le bon sens. La voix dépend de votre appareil.","Escolha o significado correto. A voz depende do dispositivo."];const s=document.querySelector('#language');function apply(l){if(!langs.includes(l))l='es';const i=langs.indexOf(l);document.documentElement.lang=l;s.value=l;document.querySelector('#heading').textContent=titles[i];document.querySelector('#intro').textContent=intro[i];document.title=titles[i]+' | HablaRD';quiz();}let stored;try{stored=localStorage.getItem('language')}catch{}apply(stored||navigator.language.slice(0,2));s.addEventListener('change',()=>{apply(s.value);try{localStorage.setItem('language',s.value)}catch{}})</script></body></html>
