sUtterance(w[0]);u.lang='es-DO';speechSynthesis.speak(u)}};a.append(b);[j,(j+1)%words.length,(j+2)%words.length].sort((a,b)=>a-b).forEach(k=>{const x=document.createElement('button');x.textContent=words[k][1][i];x.onclick=()=>{x.textContent=(k===j?'✓ ':'✗ ')+words[k][1][i];if(k===j){try{localStorage.setItem('learned-'+w[0],'1')}catch{}progress()}};a.append(x)});const link=document.createElement('a');link.href=w[2];link.textContent='ASALE';a.append(link);root.append(a)})}function progress(){let count=0;try{count=words.filter(w=>localStorage.getItem('learned-'+w[0])==='1').length}catch{}document.querySelector('#score').textContent=count+' / '+words.length}progress();</script><article><a href="https://www.asale.org/damer/">ASALE</a><p>2026-11-25</p></article><article><h2>A1 · Transporte</h2><div id="dialog"></div></article><script>const newWords=[["motoconcho",["Motorradtaxi","Taxi en moto","Motorcycle taxi","Taxi-moto","Mototáxi"],"https://www.asale.org/damer/motoconcho"],["guagüero",["Busfahrer","Conductor de autobús","Bus driver","Chauffeur de bus","Motorista de ônibus"],"https://www.asale.org/damer/guag%C3%BCero"],["guineo",["Banane","Banana","Banana","Banane","Banana"],"https://www.asale.org/damer/guineo/rompecercas"]],dialogues=[["¿Dónde está la parada?","Wo ist die Haltestelle?","¿Dónde está la parada?","Where is the stop?","Où est l’arrêt ?","Onde fica a parada?"],["¿Cuánto cuesta el pasaje?","Wie viel kostet die Fahrt?","¿Cuánto cuesta el pasaje?","How much is the fare?","Combien coûte le trajet ?","Quanto custa a passagem?"],["Voy a Higüey.","Ich fahre nach Higüey.","Voy a Higüey.","I’m going to Higüey.","Je vais à Higüey.","Vou para Higüey."]];function lesson(i){const root=document.querySelector('#dialog');root.replaceChildren();for(const d of dialogues){const p=document.createElement('p'),b=document.createElement('button');b.textContent='🔊';b.setAttribute('aria-label','Audio: '+d[0]);b.onclick=()=>{if('speechSynthesis'in window){const u=new SpeechSynthesisU
