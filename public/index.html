<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HablaRD</title><meta name="description" content="Aprende español dominicano"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#16252d;font:17px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}section{background:#6744a8;color:#fff;padding:clamp(24px,6vw,70px);border-radius:24px}h1{font-size:clamp(32px,6vw,64px)}article,.calc,#results{padding:20px;background:#fff;margin:16px 0;border-radius:16px}button,input,select{font:inherit;max-width:100%;padding:10px;margin:5px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer}a{color:#6744a8;overflow-wrap:anywhere}output{display:block;font-size:2rem}#quiz{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}#quiz article{border-top:5px solid #6744a8}#quiz button{display:block;width:95%;text-align:left}.wordcards{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.wordcards p{background:#eee9fa;padding:12px;border-radius:12px}#more-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}#more-items p{margin:0;padding:16px;border:1px solid #d8dce0;border-radius:12px}#more-items a{display:block;font-size:.85rem;margin-top:8px}header{position:sticky;top:0;background:#f5f6f7;z-index:2}#score{position:sticky;bottom:0;background:#6744a8;color:white;padding:12px;border-radius:12px}nav{display:flex;gap:16px;flex-wrap:wrap;padding:12px 0}#quiz article{box-shadow:0 4px 20px #30205012}</style></head><body><header><strong>HablaRD</strong><select id="language" aria-label="Language"><option value="de">DE</option><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="pt">PT</option></select></header><main><section><h1 id="heading">Aprende español dominicano</h1><p id="intro">Elige el significado correcto. La voz depende de tu dispositivo.</p></section><nav aria-label="A1 / A2"><a href="#quiz">Quiz</a><a href="#dialog">A1</a><a href="#a2">A2</a><a href="#more-content">Vocabulario</a></nav><div id="quiz"></div><p id="score" aria-live="polite"></p><script>const words=[['guagua',['Bus','Autobús','Bus','Bus','Ônibus'],'https://www.asale.org/damer/guagua/'],['chin',['Ein bisschen','Un poco','A little','Un peu','Um pouco'],'https://www.asale.org/damer/chin'],['concho',['Stadtverkehrsmittel','Vehículo de transporte urbano','Urban public transport vehicle','Véhicule de transport urbain','Veículo de transporte urbano'],'https://www.asale.org/damer/concho']];function quiz(){const i=langs.indexOf(document.documentElement.lang),root=document.querySelector('#quiz');root.replaceChildren();words.forEach((w,j)=>{const a=document.createElement('article'),h=document.createElement('h3');h.textContent=w[0];a.append(h);const b=document.createElement('button');b.textContent='🔊';b.setAttribute('aria-label','Audio: '+w[0]);b.onclick=()=>{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(w[0]);u.lang='es-DO';speechSynthesis.speak(u)}};a.append(b);[j,(j+1)%words.length,(j+2)%words.length].sort((a,b)=>a-b).forEach(k=>{const x=document.createElement('button');x.textContent=words[k][1][i];x.onclick=()=>{x.textContent=(k===j?'✓ ':'✗ ')+words[k][1][i];if(k===j){try{localStorage.setItem('learned-'+w[0],'1')}catch{}progress()}};a.append(x)});const link=document.createElement('a');link.href=w[2];link.textContent='ASALE';a.append(link);root.append(a)})}function progress(){let count=0;try{count=words.filter(w=>localStorage.getItem('learned-'+w[0])==='1').length}catch{}document.querySelector('#score').textContent=count+' / '+words.length}progress();</script><article><a href="https://www.asale.org/damer/">ASALE</a><p>2026-11-25</p></article><article><h2>A1 · Transporte</h2><div id="dialog"></div></article><script>const newWords=[["motoconcho",["Motorradtaxi","Taxi en moto","Motorcycle taxi","Taxi-moto","Mototáxi"],"https://www.asale.org/damer/motoconcho"],["guagüero",["Busfahrer","Conductor de autobús","Bus driver","Chauffeur de bus","Motorista de ônibus"],"https://www.asale.org/damer/guag%C3%BCero"],["guineo",["Banane","Banana","Banana","Banane","Banana"],"https://www.asale.org/damer/guineo/rompecercas"]],dialogues=[["¿Dónde está la parada?","Wo ist die Haltestelle?","¿Dónde está la parada?","Where is the stop?","Où est l’arrêt ?","Onde fica a parada?"],["¿Cuánto cuesta el pasaje?","Wie viel kostet die Fahrt?","¿Cuánto cuesta el pasaje?","How much is the fare?","Combien coûte le trajet ?","Quanto custa a passagem?"],["Voy a Higüey.","Ich fahre nach Higüey.","Voy a Higüey.","I’m going to Higüey.","Je vais à Higüey.","Vou para Higüey."]];function lesson(i){const root=document.querySelector('#dialog');root.replaceChildren();for(const d of dialogues){const p=document.createElement('p'),b=document.createElement('button');b.textContent='🔊';b.setAttribute('aria-label','Audio: '+d[0]);b.onclick=()=>{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(d[0]);u.lang='es-DO';speechSynthesis.speak(u)}};p.append(b,document.createTextNode(d[0]+' — '+d[i+1]));root.append(p)}const cards=document.createElement('div');cards.className='wordcards';for(const w of newWords){const p=document.createElement('p'),a=document.createElement('a');a.href=w[2];a.textContent='ASALE';p.append(document.createTextNode(w[0]+' — '+w[1][i]+' · '),a);cards.append(p)}root.append(cards)}</script><article id="more-content"><h2 id="more-heading"></h2><div id="more-items"></div></article><script>const moreRows=[["yipeta — Geländewagen","yipeta — todoterreno","yipeta — off-road vehicle","yipeta — véhicule tout-terrain","yipeta — veículo todo-terreno"],["habichuela — Bohne","habichuela — frijol","habichuela — bean","habichuela — haricot","habichuela — feijão"],["auyama — Kürbis","auyama — calabaza","auyama — s ocument.querySelector('#a2-dialog');root.replaceChildren();for(const d of a2rows){const p=document.createElement('p');p.textContent=d[0]+' — '+d[i+1];root.append(p)}}</script></main><footer>HablaRD · República Dominicana</footer><script>const langs=["de","es","en","fr","pt"],titles=["Dominikanisch lernen","Aprende español dominicano","Learn Dominican Spanish","Apprendre l’espagnol dominicain","Aprender espanhol dominicano"],intro=["Wähle die passende Bedeutung. Die Sprachausgabe hängt von deinem Gerät ab.","Elige el significado correcto. La voz depende de tu dispositivo.","Choose the correct meaning. Audio depends on your device.","Choisissez le bon sens. La voix dépend de votre appareil.","Escolha o significado correto. A voz depende do dispositivo."];const s=document.querySelector('#language');function apply(l){if(!langs.includes(l))l='es';const i=langs.indexOf(l);document.documentElement.lang=l;s.value=l;document.querySelector('#heading').textContent=titles[i];document.querySelector('#intro').textContent=intro[i];more(i);document.title=titles[i]+' | HablaRD';if(words.length===3){words.push(...newWords,...moreRows.map((r,j)=>[r[0].split(' — ')[0],r.map(x=>x.split(' — ')[1]),moreSource[j]]),...[["mangú",["Kochbananenpüree","Puré de plátano","Mashed plantain","Purée de plantain","Purê de banana-da-terra"]],["yaniqueque",["Frittierter Teigfladen","Torta de harina frita","Fried dough flatbread","Galette de pâte frite","Massa frita"]],["conuco",["Kleines Anbaugrundstück","Pequeña parcela agrícola","Small cultivated plot","Petite parcelle cultivée","Pequena parcela agrícola"]],["cazabe",["Maniokfladen","Torta de yuca","Cassava flatbread","Galette de manioc","Beiju de mandioca"]],["conuquero",["Kleinbauer","Cultivador de conuco","Small-plot farmer","Cultivateur de petite parcelle","Cultivador de pequena parcela"]]].map(w=>[w[0],w[1],'https://www.asale.org/damer/'+encodeURIComponent(w[0])]));words.push(...[["zafacón",["Mülleimer","Cubo de basura","Trash can","Poubelle","L
